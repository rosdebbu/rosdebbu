<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 100" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131d" />
      <stop offset="100%" stop-color="#090d14" />
    </linearGradient>
    <linearGradient id="purpleAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7952d8" />
      <stop offset="100%" stop-color="#a371f7" />
    </linearGradient>
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card 1: Education -->
  <g transform="translate(0, 0)">
    <rect x="2" y="2" width="292" height="96" rx="8" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.2"/>
    <text x="148" y="32" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#7d8590">ACADEMICS // SRMIST</text>
    <text x="148" y="58" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold" fill="#a371f7">B.Tech CSE (DS)</text>
    <text x="148" y="78" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#8b949e">4th Sem • Class of 2028</text>
  </g>

  <!-- Card 2: Status -->
  <g transform="translate(312, 0)">
    <rect x="2" y="2" width="292" height="96" rx="8" fill="url(#cardGrad)" stroke="#238636" stroke-width="1.2"/>
    <circle cx="148" cy="22" r="4" fill="#3fb950" filter="url(#cardGlow)"/>
    <text x="148" y="44" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#3fb950" font-weight="bold">OPPORTUNITIES</text>
    <text x="148" y="66" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="bold" fill="#e6edf3">Open for Internships</text>
    <text x="148" y="82" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#8b949e">SWE • Full-Stack • ML</text>
  </g>

  <!-- Card 3: Domains -->
  <g transform="translate(624, 0)">
    <rect x="2" y="2" width="292" height="96" rx="8" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.2"/>
    <text x="148" y="32" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#7d8590">CORE FOCUS // SYSTEMS</text>
    <text x="148" y="58" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold" fill="#58a6ff">Full-Stack &amp; GNN</text>
    <text x="148" y="78" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#8b949e">FastAPI • React • PyTorch</text>
  </g>
</svg>
