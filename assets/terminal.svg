    </text>

    <!-- 03. Education -->
    <text y="40">
      <tspan class="mono-key">Education</tspan>
      <tspan class="mono-dots"> ............. </tspan>
      <tspan class="mono-val">B.Tech CSE (Data Science) • SRMIST</tspan>
    </text>

    <!-- 04. Status -->
    <text y="60">
      <tspan class="mono-key">Status</tspan>
