      <tspan class="mono-dots"> ......... </tspan>
      <tspan class="mono-val">React 19 • Next.js 14 • Tailwind CSS • Vite</tspan>
    </text>

    <!-- 07. Core.Backend -->
    <text y="120">
      <tspan class="mono-key">Core.Backend</tspan>
      <tspan class="mono-dots"> .......... </tspan>
      <tspan class="mono-val">FastAPI • Node.js • Express • WebSockets</tspan>
    </text>

    <!-- 08. Core.Databases -->
    <text y="140">
      <tspan class="mono-key">Core.Databases</tspan>
      <tspan class="mono-dots"> ........ </tspan>
      <tspan class="mono-val">PostgreSQL (Neon) • MySQL • Prisma ORM</tspan>
    </text>

    <!-- 09. Core.AI_ML -->
    <text y="160">
      <tspan class="mono-key">Core.AI/ML</tspan>
      <tspan class="mono-dots"> ........... </tspan>
      <tspan class="mono-val">Graph Neural Networks (GNN) • Knowledge Graphs</tspan>
    </text>

    <!-- 10. Core.Infra -->
    <text y="180">
      <tspan class="mono-key">Core.Infra</tspan>
      <tspan class="mono-dots"> ........... </tspan>
      <tspan class="mono-val">Docker • WSL2 • Linux • Vercel • Render</tspan>
    </text>

    <!-- 11. Grid.Portfolio -->
    <text y="200">
      <tspan class="mono-key">Grid.Portfolio</tspan>
      <tspan class="mono-dots"> ....... </tspan>
      <tspan class="mono-val-cyan">debjitttt-ross.vercel.app</tspan>
