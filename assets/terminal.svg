  <text x="42" y="358" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#8b949e">LOC : <tspan fill="#e6edf3">SRMIST, India</tspan></text>
  <text x="42" y="375" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#8b949e">DEG : <tspan fill="#a371f7">B.Tech CSE (DS)</tspan></text>
  <text x="42" y="392" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#8b949e">GRAD : <tspan fill="#58a6ff">Class of 2028</tspan></text>

  <!-- ==================== RIGHT PANEL: SYSTEM.INFO ==================== -->
  <rect x="305" y="55" width="595" height="365" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <path d="M 305 63 Q 305 55 313 55 L 892 55 Q 900 55 900 63 L 900 80 L 305 80 Z" fill="#161b22"/>
  <line x1="305" y1="80" x2="900" y2="80" stroke="#21262d" stroke-width="1"/>
  
  <text x="320" y="72" class="mono-header">// SYSTEM.INFO</text>
  <text x="800" y="72" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#7d8590">STATUS: <tspan fill="#3fb950">READY</tspan></text>

  <!-- Shell Command Prompt -->
  <text x="322" y="102" class="mono-prompt-user">debjit@system<tspan fill="#8b949e">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#8b949e">$</tspan> <tspan class="mono-prompt-cmd">neofetch --profile</tspan></text>
  <line x1="322" y1="112" x2="880" y2="112" stroke="#21262d" stroke-width="1"/>

  <!-- System Info Properties List -->
