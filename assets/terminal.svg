    <!-- 01. Subject -->
    <text y="0">
      <tspan class="mono-key">Subject</tspan>
      <tspan class="mono-dots"> ............... </tspan>
      <tspan class="mono-val-purple">Debjit (Ross) Das</tspan>
    </text>

    <!-- 02. Role -->
    <text y="20">
      <tspan class="mono-key">Role</tspan>
      <tspan class="mono-dots"> .................. </tspan>
