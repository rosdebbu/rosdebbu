<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="60%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#05080c" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a371f7" />
      <stop offset="100%" stop-color="#58a6ff" />
    </linearGradient>

    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7952d8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#30363d" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .mono-title { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; font-size: 12px; fill: #8b949e; }
      .mono-header { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; fill: #58a6ff; font-weight: 600; letter-spacing: 0.5px; }
      .mono-key { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #7d8590; }
      .mono-dots { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #30363d; }
      .mono-val { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #e6edf3; font-weight: 500; }
      .mono-val-purple { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #a371f7; font-weight: 600; }
      .mono-val-cyan { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #79c0ff; font-weight: 500; }
      .mono-prompt-user { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #3fb950; font-weight: 600; }
      .mono-prompt-cmd { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #e6edf3; }
      .cursor-blink { fill: #a371f7; animation: cursorPulse 1s infinite steps(2, start); }
      @keyframes cursorPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      .cyber-dot { fill: #a371f7; opacity: 0.7; }
    </style>
  </defs>

  <!-- Outer Window Shell -->
  <rect x="2" y="2" width="916" height="476" rx="12" fill="url(#termBg)" stroke="url(#borderGlow)" stroke-width="1.5"/>

  <!-- Window Header Bar -->
  <path d="M 2 14 Q 2 2 14 2 L 906 2 Q 918 2 918 14 L 918 40 L 2 40 Z" fill="#161b22" />
  <line x1="2" y1="40" x2="918" y2="40" stroke="#30363d" stroke-width="1"/>

  <!-- macOS Traffic Light Window Buttons -->
  <circle cx="24" cy="21" r="6" fill="#ff5f56" />
  <circle cx="44" cy="21" r="6" fill="#ffbd2e" />
  <circle cx="64" cy="21" r="6" fill="#27c93f" />

  <!-- Window Center Title -->
  <text x="460" y="25" text-anchor="middle" class="mono-title">rosdebbu@archlinux: ~/profile — system.live (zsh)</text>

  <!-- Live Status Badge -->
  <rect x="830" y="12" width="72" height="20" rx="10" fill="#1f2d24" stroke="#238636" stroke-width="1"/>
  <circle cx="842" cy="22" r="3.5" fill="#3fb950" filter="url(#softGlow)"/>
  <text x="852" y="26" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="bold" fill="#3fb950">LIVE</text>

  <!-- ==================== LEFT PANEL: VISUAL.MAP ==================== -->
  <rect x="20" y="55" width="270" height="365" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <path d="M 20 63 Q 20 55 28 55 L 282 55 Q 290 55 290 63 L 290 80 L 20 80 Z" fill="#161b22"/>
  <line x1="20" y1="80" x2="290" y2="80" stroke="#21262d" stroke-width="1"/>
  <text x="32" y="72" class="mono-header">// VISUAL.MAP</text>
  <rect x="236" y="63" width="44" height="13" rx="3" fill="#7952d8" opacity="0.25"/>
  <text x="241" y="73" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a371f7" font-weight="bold">AI_DEV</text>

  <!-- Cyberpunk Developer Vector Art -->
  <g transform="translate(155, 195)">
    <!-- Cyber Background Ring -->
    <circle cx="0" cy="-5" r="78" fill="#080c14" stroke="#21262d" stroke-width="1" stroke-dasharray="4,4"/>
    <circle cx="0" cy="-5" r="62" fill="none" stroke="#7952d8" stroke-width="0.8" opacity="0.3"/>
    
    <!-- Matrix nodes & data lines -->
    <line x1="-65" y1="-50" x2="-80" y2="-70" stroke="#a371f7" stroke-width="1" opacity="0.4"/>
    <circle cx="-80" cy="-70" r="2.5" fill="#58a6ff" filter="url(#softGlow)"/>
    <line x1="65" y1="-50" x2="80" y2="-70" stroke="#a371f7" stroke-width="1" opacity="0.4"/>
    <circle cx="80" cy="-70" r="2.5" fill="#58a6ff" filter="url(#softGlow)"/>
    
    <line x1="-55" y1="55" x2="-75" y2="75" stroke="#7952d8" stroke-width="1" opacity="0.4"/>
    <circle cx="-75" cy="75" r="2" fill="#a371f7"/>
    <line x1="55" y1="55" x2="75" y2="75" stroke="#7952d8" stroke-width="1" opacity="0.4"/>
    <circle cx="75" cy="75" r="2" fill="#a371f7"/>

    <!-- Developer Body & Hoodie -->
    <path d="M -60 70 C -40 45, -20 40, 0 40 C 20 40, 40 45, 60 70 L 70 88 C 45 92, -45 92, -70 88 Z" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
    <line x1="-18" y1="42" x2="-14" y2="72" stroke="#58a6ff" stroke-width="1.2" stroke-dasharray="2,2"/>
    <line x1="18" y1="42" x2="14" y2="72" stroke="#58a6ff" stroke-width="1.2" stroke-dasharray="2,2"/>
    
    <!-- Neck -->
    <path d="M -14 24 C -14 36, 14 36, 14 24 Z" fill="#0d1117" stroke="#7952d8" stroke-width="1.2"/>

    <!-- Face Silhouette -->
    <path d="M -26 -12 C -26 14, -16 32, 0 32 C 16 32, 26 14, 26 -12 C 26 -32, -26 -32, -26 -12 Z" fill="#0d1117" stroke="#e6edf3" stroke-width="1.2"/>

    <!-- Developer Glasses -->
    <rect x="-24" y="-16" width="20" height="13" rx="3" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <rect x="4" y="-16" width="20" height="13" rx="3" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <line x1="-4" y1="-10" x2="4" y2="-10" stroke="#58a6ff" stroke-width="1.5"/>
    <!-- Glint in lenses -->
    <line x1="-20" y1="-12" x2="-10" y2="-5" stroke="#ffffff" stroke-width="1" opacity="0.8"/>
    <line x1="8" y1="-12" x2="18" y2="-5" stroke="#ffffff" stroke-width="1" opacity="0.8"/>

    <!-- Hair Silhouette -->
    <path d="M -30 -18 C -34 -44, -18 -56, 0 -56 C 18 -56, 34 -44, 30 -18 C 26 -35, 10 -46, 0 -45 C -10 -46, -26 -35, -30 -18 Z" fill="#21262d" stroke="#a371f7" stroke-width="1.5"/>
    <path d="M -22 -32 C -12 -44, -3 -32, -1 -22" stroke="#a371f7" stroke-width="1.2" fill="none"/>
    <path d="M 22 -32 C 12 -44, 3 -32, 1 -22" stroke="#a371f7" stroke-width="1.2" fill="none"/>
    <path d="M -6 -42 C 0 -50, 6 -42, 3 -28" stroke="#58a6ff" stroke-width="1.2" fill="none"/>

    <!-- Over-Ear Studio Headphones -->
    <path d="M -36 -12 C -36 -60, 36 -60, 36 -12" fill="none" stroke="#7952d8" stroke-width="4" stroke-linecap="round"/>
    <path d="M -36 -12 C -36 -60, 36 -60, 36 -12" fill="none" stroke="#a371f7" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Left Cup -->
    <rect x="-44" y="-20" width="12" height="26" rx="5" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <circle cx="-38" cy="-7" r="3" fill="#a371f7" filter="url(#softGlow)"/>
    <!-- Right Cup -->
    <rect x="32" y="-20" width="12" height="26" rx="5" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <circle cx="38" cy="-7" r="3" fill="#a371f7" filter="url(#softGlow)"/>
  </g>

