    </text>

    <!-- 13. Grid.LinkedIn -->
    <text y="240">
      <tspan class="mono-key">Grid.LinkedIn</tspan>
      <tspan class="mono-dots"> ........ </tspan>
      <tspan class="mono-val">linkedin.com/in/debjit-das-6b0452327</tspan>
    </text>

    <!-- 14. Grid.GitHub -->
    <text y="260">
      <tspan class="mono-key">Grid.GitHub</tspan>
      <tspan class="mono-dots"> .......... </tspan>
      <tspan class="mono-val-purple">github.com/rosdebbu</tspan>
    </text>
  </g>

  <!-- ==================== BOTTOM INTERACTIVE BAR ==================== -->
  <rect x="20" y="432" width="880" height="32" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text x="34" y="452" class="mono-prompt-user">debjit@system<tspan fill="#8b949e">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#8b949e">$</tspan> <tspan font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#8b949e">more info on projects below in README</tspan><tspan class="cursor-blink"> █</tspan></text>
  <text x="750" y="452" font-family="'JetBrains Mono', monospace" font-size="11" fill="#7d8590">STATUS: OPEN TO WORK</text>

</svg>
